# INFO
quarkus.application.name=MoneyStats

# Configurazione risorse statiche
quarkus.http.static-resources.index-page=index.html

# HTTP
quarkus.http.access-log.enabled=true
quarkus.http.record-request-start-time=true
quarkus.http.access-log.pattern=ip=%h user=%u method=%m requestUri="%U" responseCode=%s responseBytes=%b responseTime=%D
quarkus.http.access-log.exclude-pattern=/q/health/.*
quarkus.http.filter.index-nocache.matches=/*
quarkus.http.filter.index-nocache.header."Cache-Control"=no-cache
quarkus.http.auth.proactive=false
quarkus.http.proxy.proxy-address-forwarding=true

# FRONTEND
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.host=0.0.0.0
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# DATABASE
quarkus.datasource.db-kind=oracle
# locale
%dev.quarkus.datasource.username=${dev-oracle-moneystats-username}
%dev.quarkus.datasource.jdbc.url=${dev-oracle-moneystats-url}
%dev.quarkus.datasource.password=${dev-oracle-moneystats-password}
# online
%cloud.quarkus.datasource.username=${cloud-oracle-moneystats-username}
%cloud.quarkus.datasource.jdbc.url=${cloud-oracle-moneystats-url}
%cloud.quarkus.datasource.password=${cloud-oracle-moneystats-password}
# render
%prod.quarkus.datasource.username=${ORACLE_DB_USER}
%prod.quarkus.datasource.jdbc.url=${ORACLE_DB_URL}
%prod.quarkus.datasource.password=${ORACLE_DB_PASSWORD}

# HIBERNATE
quarkus.hibernate-orm.packages=carmine.pittella.home.model.entity
quarkus.hibernate-orm.dialect=org.hibernate.dialect.OracleDialect
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# TOKEN JWT
mp.jwt.verify.issuer=carmine-home-app
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}



